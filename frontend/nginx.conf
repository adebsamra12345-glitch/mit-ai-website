server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml;

    # Hashed build assets never change: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Every public route is prerendered to <route>/index.html; anything else is a real 404.
    location / {
        try_files $uri $uri/index.html =404;
    }
    error_page 404 /404.html;
}
