services:
  mit_frontend:
    build: ./frontend
    container_name: mit_frontend
    restart: always
    networks:
      - shared_traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=shared_traefik_net"
      - "traefik.http.routers.mit_frontend.rule=Host(`mitaitechnology.tech`) || Host(`www.mitaitechnology.tech`)"
      - "traefik.http.routers.mit_frontend.entrypoints=websecure"
      - "traefik.http.routers.mit_frontend.tls.certresolver=myresolver"
      - "traefik.http.services.mit_frontend.loadbalancer.server.port=80"

  mit_backend:
    build: ./backend
    container_name: mit_backend
    restart: always
    environment:
      DEBUG: "False"
      DB_PATH: /data/db.sqlite3
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - mit_data:/data
    networks:
      - shared_traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=shared_traefik_net"
      - "traefik.http.routers.mit_backend.rule= (Host(`mitaitechnology.tech`) || Host(`www.mitaitechnology.tech`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.mit_backend.entrypoints=websecure"
      - "traefik.http.routers.mit_backend.tls.certresolver=myresolver"
      - "traefik.http.services.mit_backend.loadbalancer.server.port=8000"
      # Admin panel (/admin) with a login rate limit, and its static files (/django-static)
      - "traefik.http.middlewares.mit_admin_rl.ratelimit.average=20"
      - "traefik.http.middlewares.mit_admin_rl.ratelimit.period=1m"
      - "traefik.http.middlewares.mit_admin_rl.ratelimit.burst=30"
      - "traefik.http.routers.mit_admin.rule=(Host(`mitaitechnology.tech`) || Host(`www.mitaitechnology.tech`)) && PathPrefix(`/admin`)"
      - "traefik.http.routers.mit_admin.entrypoints=websecure"
      - "traefik.http.routers.mit_admin.tls.certresolver=myresolver"
      - "traefik.http.routers.mit_admin.middlewares=mit_admin_rl"
      - "traefik.http.routers.mit_admin.service=mit_backend"
      - "traefik.http.routers.mit_static.rule=(Host(`mitaitechnology.tech`) || Host(`www.mitaitechnology.tech`)) && PathPrefix(`/django-static`)"
      - "traefik.http.routers.mit_static.entrypoints=websecure"
      - "traefik.http.routers.mit_static.tls.certresolver=myresolver"
      - "traefik.http.routers.mit_static.service=mit_backend"

networks:
  shared_traefik_net:
    external: true

volumes:
  mit_data:
